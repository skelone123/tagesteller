<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tagesteller</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Ernährungstagebuch mit Nährstoffübersicht">
<meta name="theme-color" content="#2f6b4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tagesteller">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
/* Layout: eine ruhige Spalte (max. 720 px fürs iPad), Tagesbilanz oben, Mahlzeiten darunter, feste Tab-Leiste unten.
   Ton: Kräutergarten – tiefes Salbeigrün auf leicht grünlichem Papierweiß, große gut lesbare Schrift. */
:root{
  --bg:#f2f5f0; --surface:#ffffff; --surface-2:#e7ede4; --line:#d3dccf;
  --fg:#18231c; --muted:#56665b; --accent:#2f6b4f; --accent-ink:#ffffff; --accent-soft:#dbeadf;
  --good:#2c8152; --warn:#a66d0b; --bad:#b03f2c; --empty:#c4cec0;
  --font-body:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-display:"Fraunces",Georgia,"Times New Roman",serif;
  --r:14px; --tab-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111713; --surface:#1a221d; --surface-2:#232d26; --line:#2f3b33;
  --fg:#e6eee8; --muted:#9db0a3; --accent:#82c9a2; --accent-ink:#0e1a13; --accent-soft:#223629;
  --good:#6fcf97; --warn:#e5bd5c; --bad:#f08b78; --empty:#3a463e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111713; --surface:#1a221d; --surface-2:#232d26; --line:#2f3b33;
  --fg:#e6eee8; --muted:#9db0a3; --accent:#82c9a2; --accent-ink:#0e1a13; --accent-soft:#223629;
  --good:#6fcf97; --warn:#e5bd5c; --bad:#f08b78; --empty:#3a463e; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:18px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:720px;margin:0 auto;padding-block:12px calc(var(--tab-h) + 28px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--font-display);font-weight:600;font-size:1.65rem;line-height:1.15}
h2{font-size:1.15rem}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wrap{flex-wrap:wrap}

/* Kopf */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:6px 10px;margin-bottom:6px}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.datebar{display:flex;align-items:center;gap:8px}
.datebtn{flex:1;min-width:0;position:relative;background:none;border:0;padding:0;text-align:left}
.datebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.iconbtn{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;min-height:44px;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* Karten */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.summary{display:grid;gap:14px}
.kcal{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.kcal b{font-family:var(--font-display);font-weight:600;font-size:2.6rem;line-height:1}
.bigbar{height:14px;border-radius:7px;background:var(--surface-2);overflow:hidden;position:relative}
.bigbar i{position:absolute;inset:0 auto 0 0;border-radius:7px;background:var(--accent)}
.macros{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.macro{min-width:0}
.macro .lab{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.macro .val{font-weight:700;font-size:1.05rem}
.minibar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.minibar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
@media (max-width:420px){.macros{grid-template-columns:repeat(2,minmax(0,1fr))}}

.meal{padding:0;overflow:hidden}
.meal-h{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px 6px}
.meal-h span{color:var(--muted);font-size:.95rem}
.entry{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:12px 16px;text-align:left;min-height:56px}
.entry:first-of-type{border-top:0}
.entry .nm{flex:1;min-width:0}
.entry .nm div{overflow-wrap:anywhere}
.entry .kc{font-weight:700;white-space:nowrap}
.meal-f{display:flex;gap:8px;padding:10px 12px 12px;flex-wrap:wrap}
.addbtn{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--accent-soft);color:var(--fg);border-radius:12px;padding:10px 16px;min-height:48px;font-weight:700}
.addbtn svg{width:20px;height:20px;color:var(--accent)}
.ghost{border:1px solid var(--line);background:transparent;border-radius:12px;padding:10px 14px;min-height:48px}

/* Nährstoffzeilen */
.ngroup h3{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 0 2px}
.nrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line)}
.nrow:first-of-type{border-top:0}
.nrow .nl{min-width:0}
.nrow .nv{text-align:right;white-space:nowrap}
.nrow .bar{grid-column:1 / -1;height:10px;border-radius:5px;background:var(--surface-2);position:relative;overflow:hidden}
.nrow .bar i{position:absolute;inset:0 auto 0 0;border-radius:5px}
.st-ok{background:var(--good)} .st-low{background:var(--warn)} .st-over{background:var(--bad)} .st-mid{background:var(--accent)}
.txt-ok{color:var(--good)} .txt-low{color:var(--warn)} .txt-over{color:var(--bad)}
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);vertical-align:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:0;background:var(--c)}

/* Tab-Leiste */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:6px 0;border-radius:12px;color:var(--muted);font-size:.74rem;min-height:52px;min-width:0}
.tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:380px){.tab{font-size:.66rem}}
input[type=date]{padding-inline:10px;min-width:0}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--accent);font-weight:700;background:var(--accent-soft)}

/* Blatt (Dialog von unten) */
.sheet-wrap{position:fixed;inset:0;z-index:40;background:rgba(10,20,14,.38);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;height:calc(100% - 24px - env(safe-area-inset-top,0px));border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet-h{display:flex;align-items:center;gap:8px;padding:12px 12px 10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.sheet-h h2{flex:1;min-width:0;overflow-wrap:anywhere}
.sheet-b{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.textbtn{border:0;background:none;color:var(--accent);font-weight:700;padding:10px;min-height:44px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.6}}}

/* Formulare */
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.95rem}
input[type=text],input[type=number],input[type=search],input[type=date],select{width:100%;font-size:18px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);min-height:50px}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--muted);pointer-events:none}
.search input{padding-left:46px}
.btn{border:0;border-radius:14px;padding:14px 20px;min-height:54px;font-weight:700;font-size:1.05rem;background:var(--accent);color:var(--accent-ink);width:100%}
.btn.sec{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:12px 16px;min-height:60px}
.item:first-child{border-top:0}
.item .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.item .sub{font-size:.84rem;color:var(--muted)}
.item .kc{white-space:nowrap;color:var(--muted);font-size:.9rem}
.amount{display:flex;align-items:center;gap:10px}
.amount input{text-align:center;font-size:1.6rem;font-weight:700}
.amount .iconbtn{width:56px;height:56px}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;min-height:50px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.preview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;text-align:center}
.preview div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 4px}
.preview b{display:block;font-size:1.15rem}
.preview span{font-size:.75rem;color:var(--muted)}
details summary{cursor:pointer;font-weight:700;color:var(--accent);padding:8px 0;min-height:44px}
.note{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:.92rem}
.empty{text-align:center;padding:22px 12px;color:var(--muted)}

/* Tabellen */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:10px 12px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
thead th{border-top:0;font-size:.82rem;color:var(--muted);vertical-align:bottom;white-space:normal}
tr.sel td{background:var(--accent-soft)}
td.best{font-weight:700;color:var(--accent)}
.chart{width:100%;display:block}
.chart text{fill:var(--muted);font-family:var(--font-body)}
.tile3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile3 div{min-width:0}
.tile3 b{display:block;font-size:1.3rem}
.tile3 span{font-size:.8rem;color:var(--muted)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 22px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;font-size:.95rem;width:max-content;max-width:calc(100% - 32px);text-align:center}
.dlg-wrap{position:fixed;inset:0;z-index:70;background:rgba(10,20,14,.45);display:grid;place-items:center;padding:16px}
.dlg{background:var(--surface);border-radius:18px;padding:20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs" aria-label="Bereiche"><div class="tabs-in" id="tabs"></div></nav>
<script src="foods.js"></script>
<script>
(function(){
'use strict';
const KEYS = window.FOOD_KEYS;
const NUTR = [
 {k:'kcal',l:'Kalorien',u:'kcal',g:'Energie',kind:'ziel'},
 {k:'prot',l:'Eiweiß',u:'g',g:'Makronährstoffe',kind:'min'},
 {k:'fat',l:'Fett',u:'g',g:'Makronährstoffe',kind:'ziel'},
 {k:'sfa',l:'davon gesättigte Fettsäuren',s:'Gesätt. Fett',u:'g',g:'Makronährstoffe',kind:'max'},
 {k:'carb',l:'Kohlenhydrate',u:'g',g:'Makronährstoffe',kind:'ziel'},
 {k:'sugar',l:'davon Zucker',s:'Zucker',u:'g',g:'Makronährstoffe',kind:'max'},
 {k:'fib',l:'Ballaststoffe',u:'g',g:'Makronährstoffe',kind:'min'},
 {k:'salt',l:'Salz',u:'g',g:'Makronährstoffe',kind:'max'},
 {k:'ca',l:'Calcium',u:'mg',g:'Mineralstoffe',kind:'min'},
 {k:'mg',l:'Magnesium',u:'mg',g:'Mineralstoffe',kind:'min'},
 {k:'fe',l:'Eisen',u:'mg',g:'Mineralstoffe',kind:'min'},
 {k:'zn',l:'Zink',u:'mg',g:'Mineralstoffe',kind:'min'},
 {k:'k',l:'Kalium',u:'mg',g:'Mineralstoffe',kind:'min'},
 {k:'vitA',l:'Vitamin A',u:'µg',g:'Vitamine',kind:'min'},
 {k:'vitC',l:'Vitamin C',u:'mg',g:'Vitamine',kind:'min'},
 {k:'vitD',l:'Vitamin D',u:'µg',g:'Vitamine',kind:'min'},
 {k:'vitE',l:'Vitamin E',u:'mg',g:'Vitamine',kind:'min'},
 {k:'b12',l:'Vitamin B12',u:'µg',g:'Vitamine',kind:'min'},
 {k:'fol',l:'Folat',u:'µg',g:'Vitamine',kind:'min'}
];
const NBY = Object.fromEntries(NUTR.map(n=>[n.k,n]));
// DGE-Referenzwerte für Frauen ab 65 Jahren (Fett 30 %, Kohlenhydrate ca. 50 % der Energie; Zucker als Orientierung)
const DGE_W65 = {kcal:1700,prot:57,fat:57,sfa:19,carb:210,sugar:50,fib:30,salt:6,ca:1000,mg:300,fe:14,zn:8,k:4000,vitA:700,vitC:95,vitD:20,vitE:8,b12:4,fol:300};
const MEALS = [{id:'fr',l:'Frühstück'},{id:'mi',l:'Mittagessen'},{id:'ab',l:'Abendessen'},{id:'sn',l:'Zwischendurch'}];
const STORE = 'tagesteller-v1';
const OFF_CACHE = {};
const OFF_FIELDS ='code,product_name,product_name_de,brands,nutriments,serving_quantity,quantity';

/* ---------- Speicher ---------- */
function blank(){ return {v:1,entries:[],custom:[],recipes:[],saved:[],fav:[],recent:[],weights:[],goalKg:null,targets:Object.assign({},DGE_W65),welcomed:false}; }
/* Das Tagebuch liegt in IndexedDB (mehrere hundert MB möglich).
   Ältere Versionen nutzten localStorage (ca. 5 MB): diese Daten werden beim ersten Start übernommen
   und bleiben dort unverändert als Reserve liegen. Fehlt IndexedDB, wird weiter localStorage genutzt. */
const DB_NAME = 'tagesteller', DB_STORE = 'kv';
let idb = null, useLS = false;
function normalize(o){ const b = blank(); if(o && typeof o==='object'){ Object.assign(b,o); b.targets = Object.assign({},DGE_W65,o.targets||{}); } return b; }
function lsLoad(){ try{ const r = localStorage.getItem(STORE); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
function idbOpen(){ return new Promise((res,rej)=>{ let r; try{ r = indexedDB.open(DB_NAME,1); }catch(e){ rej(e); return; }
  r.onupgradeneeded = ()=>r.result.createObjectStore(DB_STORE); r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error); r.onblocked = ()=>rej(new Error('blocked')); }); }
function idbGet(k){ return new Promise((res,rej)=>{ const q = idb.transaction(DB_STORE,'readonly').objectStore(DB_STORE).get(k); q.onsuccess = ()=>res(q.result); q.onerror = ()=>rej(q.error); }); }
function idbPut(k,v){ return new Promise((res,rej)=>{ const tx = idb.transaction(DB_STORE,'readwrite'); tx.objectStore(DB_STORE).put(v,k); tx.oncomplete = ()=>res(); tx.onerror = ()=>rej(tx.error); tx.onabort = ()=>rej(tx.error); }); }
async function loadState(){
  try{
    if(!window.indexedDB) throw new Error('no idb');
    idb = await idbOpen();
    let o = await idbGet('state');
    if(!o){ const old = lsLoad(); if(old){ await idbPut('state', old); o = old; } }
    return normalize(o);
  }catch(e){ idb = null; useLS = true; return normalize(lsLoad()); }
}
let S = blank();
function save(){
  if(useLS || !idb){ try{ localStorage.setItem(STORE, JSON.stringify(S)); }catch(e){ toast('Speichern nicht möglich – Speicher voll?'); } return; }
  // put() kopiert den Stand sofort; Schreibvorgänge laufen in Reihenfolge ab
  try{ const tx = idb.transaction(DB_STORE,'readwrite'); tx.objectStore(DB_STORE).put(S,'state'); tx.onerror = tx.onabort = ()=>toast('Speichern nicht möglich'); }
  catch(e){ toast('Speichern nicht möglich'); }
}
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}

/* ---------- Hilfen ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>Array.from(el.querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad = n=>String(n).padStart(2,'0');
const iso = d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseIso = s=>{const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d);};
const addDays = (s,n)=>{const d=parseIso(s); d.setDate(d.getDate()+n); return iso(d);};
const today = ()=>iso(new Date());
const WD = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const fmtDateLong = s=>parseIso(s).toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
const fmtDateShort = s=>{const d=parseIso(s); return d.getDate()+'.'+(d.getMonth()+1)+'.';};
function fmt(v,unit){
  if(v==null||isNaN(v)) return '–';
  let dec = 0;
  if(unit!=='kcal'){ if(Math.abs(v)<1 && v!==0) dec = 2; else if(Math.abs(v)<10) dec = 1; }
  return Number(v).toLocaleString('de-DE',{maximumFractionDigits:dec,minimumFractionDigits:0});
}
const fmtN = (v,k)=>fmt(v,NBY[k].u)+' '+NBY[k].u;
const fold = s=>String(s).toLowerCase().replace(/ä/g,'a').replace(/ö/g,'o').replace(/ü/g,'u').replace(/ß/g,'ss');
// Andere Namen für dasselbe (Suchwort -> zusätzliche Alternative)
const ALIAS = {semmel:'brotchen',schrippe:'brotchen',weckle:'brotchen',wecken:'brotchen',paradeiser:'tomate',erdapfel:'kartoffel',topfen:'quark',
  huhn:'hahnchen',hendl:'hahnchen',hahnchen:'huhn',haehnchen:'hahnchen',krabben:'garnele',garnelen:'garnele',brokkoli:'broccoli',
  pfannkuchen:'eierkuchen',eierkuchen:'pfannkuchen',kloss:'knodel',klosse:'knodel',knodel:'kloss',moehre:'mohre',rotkraut:'rotkohl',blaukraut:'rotkohl',
  weisskraut:'weisskohl',porree:'lauch',lauch:'porree',fleischpflanzerl:'frikadelle',bulette:'frikadelle',fleischkuchle:'frikadelle',
  kassler:'kasseler',kasseler:'kassler',sosse:'sauce',sose:'sauce',bratensosse:'bratensauce',joghurt:'jogurt',spaetzle:'spatzle'};
function defaultMeal(){ const h = new Date().getHours(); return h<10?'fr':h<14?'mi':h<17?'sn':'ab'; }

/* ---------- Lebensmittel ---------- */
function arrToN(a){ const o={}; KEYS.forEach((k,i)=>o[k]=a[i]); return o; }
function parsePortions(s){ return (s||'').split(';').filter(Boolean).map(p=>{const i=p.lastIndexOf('='); return {l:p.slice(0,i),g:+p.slice(i+1)};}); }
// Alltags-Lebensmittel (mit Portionsgrößen, Schlüssel b:Position) und alle weiteren BLS-Lebensmittel (Schlüssel L:BLS-Code)
let BASE = null, BLS = null, FOODMAP = null;
function baseFoods(){ if(!BASE) BASE = window.BASE_FOODS.map((r,i)=>({key:'b:'+i,name:r[0],cat:r[1],n:arrToN(r[2]),portions:parsePortions(r[3]),src:'base',bls:r[4],fk:fold(r[0])})); return BASE; }
function blsFoods(){ if(!BLS) BLS = (window.BLS_FOODS||[]).map(r=>({key:'L:'+r[0],name:r[1],cat:(window.BLS_GROUPS||{})[r[0][0]]||'Lebensmittel',n:arrToN(r[2]),portions:[],src:'bls',bls:r[0],fk:fold(r[1])})); return BLS; }
function foodMap(){ if(!FOODMAP){ FOODMAP = new Map(); baseFoods().forEach(f=>FOODMAP.set(f.key,f)); blsFoods().forEach(f=>FOODMAP.set(f.key,f)); } return FOODMAP; }
function recipeFood(r){
  const w = r.weight>0 ? r.weight : r.items.reduce((a,it)=>a+it.g,0);
  const n = {};
  KEYS.forEach(k=>{ let sum=0, known=false; r.items.forEach(it=>{ const v=it.n[k]; if(v!=null){ sum+=v*it.g/100; known=true; } }); n[k] = known && w>0 ? sum*100/w : null; });
  const portions = r.servings>0 && w>0 ? [{l:'1 Portion',g:Math.round(w/r.servings)}] : [];
  return {key:'r:'+r.id,name:r.name,cat:'Eigene Speisen',n,portions,src:'recipe',weight:w};
}
function allFoods(){
  return [
    ...S.custom.map(c=>({key:'c:'+c.id,name:c.name,cat:'Eigene Lebensmittel',n:c.n,portions:c.portions||[],src:'custom'})),
    ...S.recipes.map(recipeFood),
    ...S.saved.map(p=>({key:'o:'+p.code,name:p.name,brand:p.brand,cat:'Gespeicherte Produkte',n:p.n,portions:p.portions||[],src:'off'})),
    ...baseFoods(),
    ...blsFoods()
  ];
}
function findFood(key){
  if(/^[bL]:/.test(key)) return foodMap().get(key) || null;
  return allFoods().find(f=>f.key===key) || null;
}
function searchFoods(q){
  // jedes Suchwort muss vorkommen; Alias-Wörter (z. B. Semmel = Brötchen) zählen als Alternative
  const words = fold(q).split(/[\s,]+/).filter(Boolean).map(w=>{
    const alts=[w]; if(ALIAS[w]) alts.push(ALIAS[w]);
    if(w.length>=6) [/n$/,/en$/,/e$/,/s$/].forEach(rx=>{ const st=w.replace(rx,''); if(st!==w && !alts.includes(st)) alts.push(st); }); // Rouladen -> Roulade
    return alts; });
  if(!words.length) return [];
  const first = words[0], SRC_RANK = {custom:-.5,recipe:-.5,off:-.4,base:0,bls:.3};
  const esc = w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  // Treffer am Wortanfang oder am Ende eines zusammengesetzten Wortes (Rinder|roulade) zählen als gut
  const goodRx = new RegExp('(^|[\\s(/\\-,])('+first.map(esc).join('|')+')|('+first.map(esc).join('|')+')(e|n|en|s|es)?(?![a-z])');
  const out = [];
  for(const f of allFoods()){
    const n = f.fk || fold(f.name+' '+(f.brand||''));
    if(!words.every(alts=>alts.some(w=>n.includes(w)))) continue;
    let s = first.some(w=>n.startsWith(w)) ? 0 : goodRx.test(n) ? 1 : 2;
    s += SRC_RANK[f.src]||0;
    if(f.src==='bls'){ // rohes Fleisch/Fisch und Tiefkühlware nach hinten, fertige Gerichte bevorzugen
      if(/[UVT]/.test(f.bls[0]) && /(^|[\s,])roh($|[\s,])/.test(n)) s += .4;
      if(n.includes('tiefgefroren')) s += .2;
    }
    out.push({f, s});
  }
  return out.sort((a,b)=>a.s-b.s||a.f.name.length-b.f.name.length||a.f.name.localeCompare(b.f.name,'de')).slice(0,80).map(x=>x.f);
}
const BLS_LABEL = 'Bundeslebensmittelschlüssel (BLS 4.0)';
const SRC_LABEL = {base:BLS_LABEL,bls:BLS_LABEL,custom:'Eigenes Lebensmittel',recipe:'Eigene Speise',off:'Open Food Facts (Herstellerangaben)'};
function totals(entries){
  const t={}, miss={}; KEYS.forEach(k=>{t[k]=0;miss[k]=0;});
  entries.forEach(e=>KEYS.forEach(k=>{ const v=e.n[k]; if(v==null) miss[k]++; else t[k]+=v*e.g/100; }));
  return {t,miss,count:entries.length};
}
function entriesOn(d){ return S.entries.filter(e=>e.d===d); }
function status(k,val){
  const tg = S.targets[k]; if(!tg) return 'mid';
  const p = val/tg, kind = NBY[k].kind;
  if(kind==='max') return p>1 ? 'over' : 'ok';
  if(kind==='ziel') return p>1.1 ? 'over' : p>=.9 ? 'ok' : 'mid';
  return p>=1 ? 'ok' : p>=.5 ? 'mid' : 'low';
}
function rememberRecent(key){ S.recent = [key,...S.recent.filter(k=>k!==key)].slice(0,20); }

/* ---------- Open Food Facts ---------- */
function offToFood(p){
  const nm = p.nutriments||{};
  const g = k=>{ const v = nm[k]; return v==null||v===''||isNaN(+v) ? null : +v; };
  const mul = (v,f)=>v==null?null:v*f;
  let kcal = g('energy-kcal_100g'); if(kcal==null && g('energy_100g')!=null) kcal = g('energy_100g')/4.184;
  const n = {kcal, prot:g('proteins_100g'), fat:g('fat_100g'), sfa:g('saturated-fat_100g'), carb:g('carbohydrates_100g'), sugar:g('sugars_100g'),
    fib:g('fiber_100g'), salt:g('salt_100g')!=null?g('salt_100g'):mul(g('sodium_100g'),2.5),
    ca:mul(g('calcium_100g'),1000), mg:mul(g('magnesium_100g'),1000), fe:mul(g('iron_100g'),1000), zn:mul(g('zinc_100g'),1000), k:mul(g('potassium_100g'),1000),
    vitA:mul(g('vitamin-a_100g'),1e6), vitC:mul(g('vitamin-c_100g'),1000), vitD:mul(g('vitamin-d_100g'),1e6), vitE:mul(g('vitamin-e_100g'),1000),
    b12:mul(g('vitamin-b12_100g'),1e6), fol:mul(g('vitamin-b9_100g')!=null?g('vitamin-b9_100g'):g('folates_100g'),1e6)};
  const name = (p.product_name_de||p.product_name||'').trim() || 'Unbenanntes Produkt';
  const portions = []; const sq = +p.serving_quantity; if(sq>0) portions.push({l:'1 Portion lt. Packung',g:Math.round(sq)});
  return {key:'o:'+p.code,code:String(p.code),name,brand:(p.brands||'').split(',')[0].trim(),cat:'Open Food Facts',n,portions,src:'off'};
}
async function offSearch(q){
  const url = 'https://world.openfoodfacts.org/cgi/search.pl?search_terms='+encodeURIComponent(q)+'&search_simple=1&action=process&json=1&page_size=30&lc=de&cc=de&fields='+OFF_FIELDS;
  const r = await fetch(url); if(!r.ok) throw new Error('http');
  const j = await r.json();
  return (j.products||[]).filter(p=>p.code && p.nutriments && (p.nutriments['energy-kcal_100g']!=null||p.nutriments['energy_100g']!=null)).map(offToFood);
}
async function offBarcode(code){
  const r = await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json?fields='+OFF_FIELDS);
  if(r.status===404) return null; if(!r.ok) throw new Error('http');
  const j = await r.json(); if(j.status!==1 || !j.product) return null;
  j.product.code = j.product.code||code; return offToFood(j.product);
}
function keepOff(f){ if(f.src!=='off') return; if(!S.saved.some(p=>p.code===f.code)) S.saved.push({code:f.code,name:f.name,brand:f.brand,n:f.n,portions:f.portions}); }

/* ---------- Toast & Bestätigung ---------- */
let toastT;
function toast(msg){ let el=$('.toast'); if(!el){ el=document.createElement('div'); el.className='toast'; el.setAttribute('role','status'); document.body.appendChild(el);} el.textContent=msg; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{el.hidden=true;},2200); }
function ask(text,ok,danger){
  return new Promise(res=>{
    const w=document.createElement('div'); w.className='dlg-wrap';
    w.innerHTML='<div class="dlg" role="alertdialog" aria-modal="true"><div>'+esc(text)+'</div><button class="btn'+(danger?' danger':'')+'" id="dlgOk">'+esc(ok)+'</button><button class="btn sec" id="dlgNo">Abbrechen</button></div>';
    document.body.appendChild(w);
    $('#dlgOk',w).onclick=()=>{w.remove();res(true);}; $('#dlgNo',w).onclick=()=>{w.remove();res(false);};
    $('#dlgOk',w).focus();
  });
}

/* ---------- Blatt-Navigation ---------- */
let stack = [];
function openSheet(render){ stack.push(render); drawSheet(); }
function backSheet(){ stack.pop(); stack.length ? drawSheet() : closeSheet(); }
function closeSheet(){ stack=[]; const w=$('.sheet-wrap'); if(w) w.remove(); document.body.style.overflow=''; }
function drawSheet(){
  let w=$('.sheet-wrap');
  if(!w){ w=document.createElement('div'); w.className='sheet-wrap'; w.innerHTML='<div class="sheet" role="dialog" aria-modal="true"><div class="sheet-h"></div><div class="sheet-b"></div></div>'; document.body.appendChild(w); w.addEventListener('click',e=>{ if(e.target===w) closeSheet(); }); document.body.style.overflow='hidden'; }
  const h=$('.sheet-h',w), b=$('.sheet-b',w);
  const cfg = stack[stack.length-1](b) || {};
  h.innerHTML = (stack.length>1 ? '<button class="iconbtn" id="shBack" aria-label="Zurück">'+I.left+'</button>' : '') + '<h2>'+esc(cfg.title||'')+'</h2>' + (cfg.extra||'') + '<button class="iconbtn" id="shClose" aria-label="Schließen">'+I.close+'</button>';
  if($('#shBack',h)) $('#shBack',h).onclick=backSheet;
  $('#shClose',h).onclick=closeSheet;
  if(cfg.after) cfg.after(h);
  b.scrollTop=0;
}

function nutrientRows(t,miss,keys){
  let out='', grp='';
  (keys||NUTR.map(n=>n.k)).forEach(k=>{
    const n=NBY[k], v=t[k], tg=S.targets[k];
    if(n.g!==grp){ if(grp) out+='</div>'; grp=n.g; out+='<div class="ngroup"><h3>'+esc(grp)+'</h3>'; }
    const st=status(k,v), pct=tg?v/tg*100:0;
    const tgTxt = tg ? (n.kind==='max'?'max. ':'')+fmt(tg,n.u)+' '+n.u : '';
    out+='<div class="nrow"><div class="nl">'+esc(n.l)+(miss&&miss[k]?' <span class="pill" title="Für einige Einträge fehlt dieser Wert">unvollständig</span>':'')+'</div>'+
      '<div class="nv num"><b>'+fmt(v,n.u)+'</b> <span class="muted small">/ '+tgTxt+' · '+Math.round(pct)+' %</span></div>'+
      '<div class="bar"><i class="st-'+st+'" style="width:'+Math.min(100,pct)+'%"></i></div></div>';
  });
  return out+'</div>';
}

/* ---------- Auswahl (Suche) ---------- */
function foodItem(f){
  const kc = f.n.kcal!=null ? fmt(f.n.kcal,'kcal')+' kcal' : '';
  const sub = f.brand ? esc(f.brand)+' · ' : (f.src!=='base'? esc(f.cat)+' · ' : '');
  return '<button class="item" data-food="'+esc(f.key)+'"><div class="nm"><div>'+esc(f.name)+'</div><div class="sub">'+sub+'je 100 g</div></div><div class="kc num">'+kc+'</div></button>';
}
function openPicker(opt){
  // opt: {meal,date} für Tagebuch | {mode:'ingredient', onPick} | {mode:'compare', onPick}
  let q = '', offRes = null, offState = '', cat = null, offTimer = null, drawTimer = null;
  const mode = opt.mode||'diary';
  const pick = f=>{
    clearTimeout(offTimer);
    if(mode==='compare'){ keepOff(f); save(); opt.onPick(f); return; }
    openSheet(body=>amountSheet(body,{food:f,mode,meal:opt.meal,date:opt.date,onPick:opt.onPick}));
  };
  openSheet(body=>{
    const draw = ()=>{
      if(!$('#pres',body)) return; // Suchfenster ist inzwischen geschlossen oder verdeckt
      const res = q.trim() ? searchFoods(q) : [];
      let html = '';
      if(q.trim()){
        html += res.length ? '<div class="list">'+res.map(foodItem).join('')+'</div>' : '<div class="empty">Nichts in der Liste gefunden.</div>';
        html += '<div class="stack" style="margin-top:14px">';
        if(!offRes && offState!=='load') html += '<button class="btn sec" id="offGo">„'+esc(q.trim())+'“ online suchen (Markenprodukte)</button>';
        if(offState==='load') html += '<div class="empty">Suche zusätzlich online bei Open Food Facts …</div>';
        if(offState==='err') html += '<div class="note">Die Online-Suche hat nicht geklappt. Bitte prüfen Sie die Internetverbindung und versuchen Sie es noch einmal.</div>';

    const runOff = async()=>{
      const qq=q.trim(); if(!qq) return;

      offState='load'; offRes=null; draw();

  });
}

  $('#gp',body).onclick=()=>{ grams=grams+(grams>=100?25:10); upd(); };

/* ---------- AUSWERTUNG ---------- */
const ST = {range:7, from:null, to:null, nut:'kcal', cmp:false, sel:null};
function rangeDays(){
  let to = today(), from;
  if(ST.range==='c' && ST.from && ST.to){ from=ST.from<ST.to?ST.from:ST.to; to=ST.from<ST.to?ST.to:ST.from; }
  else { from = addDays(to, -((ST.range==='c'?7:ST.range)-1)); }
  const days=[]; for(let d=from; d<=to; d=addDays(d,1)) days.push(d);
  return days;
}
function periodStats(days){
  const byDay = {}; S.entries.forEach(e=>{ (byDay[e.d]=byDay[e.d]||[]).push(e); });
  const daily = days.map(d=>({d, has:!!byDay[d], t: byDay[d]?totals(byDay[d]).t:null}));
  const logged = daily.filter(x=>x.has);
  const avg = {}; KEYS.forEach(k=>avg[k]= logged.length ? logged.reduce((a,x)=>a+x.t[k],0)/logged.length : null);
  return {daily,logged,avg,byDay};
}
function niceMax(v){ if(v<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
function chartSVG(daily,k,W){
  const H=230, L=46, R=12, T=14, B=34, n=daily.length, tg=S.targets[k], unit=NBY[k].u;
  const vals = daily.map(x=>x.has?x.t[k]:0);
  const ymax = niceMax(Math.max(...vals, tg||0)*1.08);
  const y = v=>T+(H-T-B)*(1-v/ymax), cw=(W-L-R)/n, bw=Math.max(2,Math.min(38,cw*.68));
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="Tageswerte '+esc(NBY[k].l)+'">';
  for(let i=0;i<=4;i++){ const v=ymax*i/4, yy=y(v); s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(yy+4)+'" text-anchor="end" font-size="11">'+fmt(v,unit)+'</text>'; }
  daily.forEach((x,i)=>{
    const cx=L+cw*i+cw/2;
    if(x.has){ const v=x.t[k], st=status(k,v); s+='<rect data-i="'+i+'" x="'+(cx-bw/2)+'" y="'+y(v)+'" width="'+bw+'" height="'+Math.max(1,y(0)-y(v))+'" rx="'+Math.min(4,bw/3)+'" fill="'+(st==='ok'?'var(--good)':st==='over'?'var(--bad)':st==='low'?'var(--warn)':'var(--accent)')+'" style="cursor:pointer'+(ST.sel===i?'':';opacity:.92')+'" stroke="'+(ST.sel===i?'var(--fg)':'none')+'" stroke-width="2"/>'; }
    else s+='<rect x="'+(cx-bw/2)+'" y="'+(y(0)-3)+'" width="'+bw+'" height="3" fill="var(--empty)"/>';
  });
  // Achsenbeschriftung
  const step = n<=7?1:n<=14?2:Math.ceil(n/6);
  daily.forEach((x,i)=>{ if(i%step && i!==n-1) return; if(step>1 && i!==n-1 && n-1-i<step) return; const cx=L+cw*i+cw/2; const lab = n<=7 ? WD[parseIso(x.d).getDay()] : fmtDateShort(x.d); s+='<text x="'+cx+'" y="'+(H-12)+'" text-anchor="middle" font-size="11">'+lab+'</text>'; });
  if(tg){ const yy=y(tg); s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--fg)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="'+(W-R)+'" y="'+(yy-5)+'" text-anchor="end" font-size="11" style="fill:var(--fg)">'+(NBY[k].kind==='max'?'Grenze ':'Ziel ')+fmt(tg,unit)+'</text>'; }
  return s+'</svg>';
}
function renderStats(){
  const days = rangeDays(), P = periodStats(days), k = ST.nut, n = NBY[k];
  let prev = null;
  if(ST.cmp){ const len=days.length, pDays=[]; for(let i=len;i>=1;i--) pDays.push(addDays(days[0],-i)); prev = periodStats(pDays); }
  const tg = S.targets[k];
  const reached = P.logged.filter(x=>{ const st=status(k,x.t[k]); return st==='ok'; }).length;
  // Quellen
  const src = {}; days.forEach(d=>(P.byDay[d]||[]).forEach(e=>{ const v=e.n[k]; if(v==null) return; const key=e.name; src[key]=(src[key]||0)+v*e.g/100; }));
  const srcTot = Object.values(src).reduce((a,b)=>a+b,0);
  const top = Object.entries(src).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const rangeChips = [[7,'7 Tage'],[14,'14 Tage'],[30,'30 Tage'],[90,'3 Monate'],['c','Zeitraum wählen']].map(([v,l])=>'<button class="chip" data-r="'+v+'" aria-pressed="'+(ST.range===v)+'">'+l+'</button>').join('');
  const selTxt = ST.sel!=null && P.daily[ST.sel] ? (()=>{ const x=P.daily[ST.sel]; return '<b>'+fmtDateLong(x.d)+':</b> '+(x.has?fmtN(x.t[k],k)+(tg?' ('+Math.round(x.t[k]/tg*100)+' % '+(n.kind==='max'?'der Grenze':'des Ziels')+')':''):'keine Einträge'); })() : 'Tippen Sie auf einen Balken für den genauen Wert.';
  const rows = NUTR.map(x=>{ const a=P.avg[x.k], t=S.targets[x.k], pct=a!=null&&t?a/t*100:null, st=a!=null?status(x.k,a):'mid';
    let dl=''; if(prev){ const pa=prev.avg[x.k]; dl = (a!=null&&pa!=null&&pa>0) ? ((a-pa)/pa*100>=0?'+':'')+Math.round((a-pa)/pa*100)+' %' : '–'; }

/* ---------- GEWICHT ---------- */
const WST = {range:90, sel:null, all:false};
const fmtKg = v=>Number(v).toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1});
const signKg = v=>(v>0.04?'+':v<-0.04?'−':'±')+fmtKg(Math.abs(v))+' kg';
function weightsSorted(){ return S.weights.slice().sort((a,b)=>a.d.localeCompare(b.d)); }
function parseKg(s){ const v=parseFloat(String(s).trim().replace(',','.')); return v>=20&&v<=300 ? Math.round(v*10)/10 : null; }
function saveWeight(d,kg){ const w=S.weights.find(x=>x.d===d); if(w){ w.kg=kg; delete w.ex; } else S.weights.push({id:uid(),d,kg}); save(); return !!w; }
const daysBetween = (a,b)=>Math.round((parseIso(b)-parseIso(a))/864e5);
function weightChart(pts,from,to,W){
  const H=240,L=44,R=16,T=18,B=34, goal=S.goalKg;
  let lo=Math.min(...pts.map(p=>p.kg)), hi=Math.max(...pts.map(p=>p.kg));
  if(goal && Math.abs(goal-lo)<8 && Math.abs(goal-hi)<8){ lo=Math.min(lo,goal); hi=Math.max(hi,goal); }
  const sp0=hi-lo, step = sp0<=2.5?0.5:sp0<=6?1:sp0<=12?2:sp0<=30?5:10;
  lo=Math.floor((lo-step*0.5)/step)*step; hi=Math.ceil((hi+step*0.5)/step)*step;
  const span=Math.max(1,daysBetween(from,to));
  const x=d=>L+(W-L-R)*daysBetween(from,d)/span, y=v=>T+(H-T-B)*(hi-v)/(hi-lo);
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="Gewichtsverlauf">';
  for(let v=lo; v<=hi+1e-9; v+=step){ const yy=y(v); s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(yy+4)+'" text-anchor="end" font-size="11">'+(step<1?fmtKg(v):Math.round(v))+'</text>'; }
  const nl = W<460?3:5;
  for(let i=0;i<nl;i++){ const d=addDays(from,Math.round(span*i/(nl-1))); const lab = span>200 ? parseIso(d).toLocaleDateString('de-DE',{month:'short',year:'2-digit'}) : parseIso(d).toLocaleDateString('de-DE',{day:'numeric',month:'short'});
    s+='<text x="'+x(d)+'" y="'+(H-10)+'" text-anchor="'+(i===0?'start':i===nl-1?'end':'middle')+'" font-size="11">'+esc(lab)+'</text>'; }
  if(goal && goal>=lo && goal<=hi){ const yy=y(goal); s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--fg)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="'+(L+6)+'" y="'+(yy-6)+'" font-size="11" style="fill:var(--fg)">Ziel '+fmtKg(goal)+' kg</text>'; }
  if(pts.length>1){ const line=pts.map(p=>x(p.d).toFixed(1)+','+y(p.kg).toFixed(1)).join(' L');
    s+='<path d="M'+x(pts[0].d).toFixed(1)+','+(H-B)+' L'+line+' L'+x(pts[pts.length-1].d).toFixed(1)+','+(H-B)+' Z" fill="var(--accent)" fill-opacity=".12"/>'+
       '<path d="M'+line+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'; }
  pts.forEach((p,i)=>{ const cx=x(p.d).toFixed(1), cy=y(p.kg).toFixed(1), sel=WST.sel===i, lastP=i===pts.length-1;
    if(pts.length<=60||sel||lastP) s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(sel?6:lastP?5:3.5)+'" fill="'+(sel?'var(--fg)':'var(--accent)')+'" stroke="var(--surface)" stroke-width="2"/>';
    s+='<circle data-w="'+i+'" cx="'+cx+'" cy="'+cy+'" r="14" fill="transparent" style="cursor:pointer"/>'; });
  return s+'</svg>';
}
function renderWeight(){
  const all=weightsSorted(), last=all[all.length-1], t=today();
  const from = WST.range==='all' ? (all[0]?all[0].d:t) : addDays(t,-(WST.range-1));
  const pts = all.filter(w=>w.d>=from && w.d<=t);

  const sel = WST.sel!=null && pts[WST.sel] ? pts[WST.sel] : null;

    (S.weights.some(w=>w.ex)?'<div class="note">Zu sehen sind <b>Beispielwerte</b>. Sie verschwinden mit „Beispieldaten löschen“ unter <b>Heute</b>.</div>':'')+
    '<section class="card stack">'+
      (last?'<div class="spread wrap"><div class="kcal"><b class="num">'+fmtKg(last.kg)+'</b><span class="muted">kg</span></div><span class="muted small">zuletzt am '+esc(fmtDateLong(last.d))+'</span></div>':'<h2>Gewicht eintragen</h2>')+
      '<form id="wf" class="stack" novalidate><div class="grid2"><label class="f">Gewicht in kg<input type="text" inputmode="decimal" id="wKg" placeholder="z. B. 64,5" autocomplete="off"></label><label class="f">Datum<input type="date" id="wD" value="'+t+'" max="'+t+'"></label></div><button class="btn" type="submit">Gewicht speichern</button></form>'+
    '</section>'+
    '<section class="card stack"><div class="spread wrap"><h2>Verlauf</h2><span class="small muted">'+(pts.length?fmtDateShort(WST.range==='all'?pts[0].d:from)+' – '+fmtDateShort(t):'')+'</span></div><div class="row wrap">'+chips+'</div>'+
      (pts.length ? '<div id="wChart" style="overflow:hidden"></div><div class="small" aria-live="polite">'+(sel?'<b>'+esc(fmtDateLong(sel.d))+':</b> '+fmtKg(sel.kg)+' kg':'Tippen Sie auf einen Punkt für den genauen Wert.')+'</div>'+
        '<div class="tile3"><div><b class="num">'+(ch!=null?signKg(ch):'–')+'</b><span>'+rangeLab+'</span></div><div><b class="num">'+(goal&&last?signKg(goal-last.kg):'–')+'</b><span>'+(goal?'bis zum Ziel ('+fmtKg(goal)+' kg)':'kein Zielgewicht')+'</span></div><div><b class="num">'+pts.length+'</b><span>Messungen</span></div></div>'
      : '<div class="empty">'+(all.length?'In diesem Zeitraum gibt es keine Messungen.':'Tragen Sie oben Ihr Gewicht ein. Am besten immer zur gleichen Tageszeit, zum Beispiel morgens vor dem Frühstück.')+'</div>')+
      '<button class="textbtn" id="wGoal" style="align-self:flex-start;padding-left:0">'+(goal?'Zielgewicht ändern':'Zielgewicht festlegen')+'</button></section>'+
    (all.length?'<section class="stack"><h2>Messungen</h2><div class="list">'+listHtml+'</div>'+(desc.length>10&&!WST.all?'<button class="btn sec" id="wAll">Alle '+desc.length+' Messungen anzeigen</button>':'')+'</section>':'')+
    '</div>';
  $('#wf').onsubmit=e=>{ e.preventDefault(); const kg=parseKg($('#wKg').value), d=$('#wD').value||t;
    if(kg==null){ toast('Bitte ein Gewicht zwischen 20 und 300 kg eingeben'); return; }
    if(d>t){ toast('Das Datum liegt in der Zukunft'); return; }
    const upd=saveWeight(d,kg); WST.sel=null; toast(upd?'Gewicht aktualisiert':'Gewicht gespeichert'); renderWeight(); };
  $$('[data-wr]').forEach(b=>b.onclick=()=>{ const v=b.dataset.wr; WST.range=v==='all'?'all':+v; WST.sel=null; renderWeight(); });
  const box=$('#wChart');
  if(box){ box.innerHTML=weightChart(pts, WST.range==='all'?pts[0].d:from, t, Math.max(280,Math.floor(box.clientWidth))); $$('[data-w]',box).forEach(c=>c.onclick=()=>{ WST.sel=+c.dataset.w; renderWeight(); }); }
  $('#wGoal').onclick=()=>openSheet(goalSheet);
  if($('#wAll')) $('#wAll').onclick=()=>{ WST.all=true; renderWeight(); };
  $$('[data-wid]').forEach(b=>b.onclick=()=>{ const w=S.weights.find(x=>x.id===b.dataset.wid); if(w) openSheet(bb=>weightEditSheet(bb,w)); });
}
function weightEditSheet(body,w){
  body.innerHTML='<form class="stack" id="we" novalidate><label class="f">Gewicht in kg<input type="text" inputmode="decimal" id="weKg" value="'+fmtKg(w.kg)+'"></label><button class="btn" type="submit">Speichern</button><button class="btn danger" type="button" id="weDel">Messung löschen</button></form>';

      else openSheet(bb=>{ bb.innerHTML='<div class="stack"><div class="small muted">'+esc(x.brand||'')+' · Barcode '+esc(x.code)+'</div><div class="card">'+nutrientRows(Object.fromEntries(KEYS.map(k=>[k,x.n[k]||0])),Object.fromEntries(KEYS.map(k=>[k,x.n[k]==null?1:0])))+'</div><div class="small muted">Werte je 100 g, Balken im Verhältnis zum Tagesziel.</div><button class="btn danger" id="sDel">Aus der Liste entfernen</button></div>'; $('#sDel',bb).onclick=()=>{ S.saved=S.saved.filter(p=>p.code!==x.code); S.fav=S.fav.filter(k=>k!=='o:'+x.code); save(); backSheet(); }; return {title:x.name}; });
    });
    return {title: kind==='own'?'Eigene Lebensmittel':kind==='rec'?'Eigene Speisen':'Gespeicherte Produkte'};
  };
}
function targetsSheet(body){
  body.innerHTML = '<form class="stack" id="tf" novalidate><div class="note">Voreingestellt sind die Referenzwerte der Deutschen Gesellschaft für Ernährung (DGE) für Frauen ab 65 Jahren. Bei besonderen Vorgaben vom Arzt tragen Sie diese hier ein.</div>'+
    '<div class="grid2">'+NUTR.map(n=>'<label class="f">'+esc(n.s||n.l)+' ('+n.u+')'+(n.kind==='max'?' max.':'')+'<input type="text" inputmode="decimal" id="t_'+n.k+'" value="'+String(S.targets[n.k]).replace('.',',')+'"></label>').join('')+'</div>'+
    '<button class="btn" type="submit">Ziele speichern</button><button class="btn sec" type="button" id="tReset">DGE-Werte wiederherstellen</button></form>';
  $('#tf',body).onsubmit=e=>{ e.preventDefault(); NUTR.forEach(n=>{ const v=parseFloat(String($('#t_'+n.k,body).value).replace(',','.')); if(v>0) S.targets[n.k]=v; }); save(); toast('Ziele gespeichert'); backSheet(); render(); };
  $('#tReset',body).onclick=()=>{ S.targets=Object.assign({},DGE_W65); save(); toast('DGE-Werte wiederhergestellt'); drawSheet(); render(); };
  return {title:'Tagesziele'};
}
function downloadFile(name,text,type){
  const file = new File([text],name,{type});
  if(navigator.canShare && navigator.canShare({files:[file]})){ navigator.share({files:[file],title:name}).catch(()=>{}); return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
}
function dataSheet(body){
  body.innerHTML = '<div class="stack">'+
    '<div class="note">Alle Daten liegen nur auf diesem Gerät. iPhone und iPad haben getrennte Tagebücher. Mit einer Sicherung können Sie Daten aufbewahren oder auf das andere Gerät übertragen (z. B. per AirDrop oder Nachricht schicken und dort hier importieren).</div>'+
    '<div class="card stack"><h2>Sicherung erstellen</h2><div class="small muted">'+S.entries.filter(e=>!e.ex).length+' Einträge, '+S.custom.length+' eigene Lebensmittel, '+S.recipes.length+' Speisen, '+S.weights.filter(w=>!w.ex).length+' Gewichtswerte</div><button class="btn" id="dExp">Sicherung speichern oder teilen</button></div>'+
    '<div class="card stack"><h2>Sicherung einspielen</h2><label class="btn sec" style="display:block;text-align:center">Sicherungsdatei auswählen<input type="file" id="dImp" accept=".json,application/json" hidden></label><div id="impMsg"></div></div>'+
    '<div class="card stack"><h2>Als Tabelle exportieren</h2><div class="small muted">Alle Einträge mit Nährwerten als CSV-Datei, zum Beispiel für den Arzt oder für Excel und Numbers.</div><button class="btn sec" id="dCsv">Mahlzeiten als Tabelle exportieren</button><button class="btn sec" id="dWcsv">Gewichtsverlauf als Tabelle exportieren</button></div>'+
    '<button class="btn danger" id="dDel">Alle Daten löschen</button></div>';
  $('#dExp',body).onclick=()=>downloadFile('tagesteller-sicherung-'+today()+'.json',JSON.stringify(S),'application/json');
  $('#dCsv',body).onclick=()=>{
    const head=['Datum','Mahlzeit','Lebensmittel','Menge (g)',...NUTR.map(n=>n.l+' ('+n.u+')')];
    const rows=S.entries.filter(e=>!e.ex).slice().sort((a,b)=>a.d.localeCompare(b.d)||MEALS.findIndex(m=>m.id===a.m)-MEALS.findIndex(m=>m.id===b.m)).map(e=>[e.d,(MEALS.find(m=>m.id===e.m)||{}).l,e.name,e.g,...NUTR.map(n=>e.n[n.k]==null?'':Math.round(e.n[n.k]*e.g/100*100)/100)]);
    const csv='﻿'+[head,...rows].map(r=>r.map(c=>{ let s=typeof c==='number'?String(c).replace('.',','):String(c==null?'':c); return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(';')).join('\r\n');
    downloadFile('tagesteller-eintraege-'+today()+'.csv',csv,'text/csv');
  };
  $('#dWcsv',body).onclick=()=>{ const rows=[['Datum','Gewicht (kg)'],...weightsSorted().filter(w=>!w.ex).map(w=>[w.d,String(w.kg).replace('.',',')])]; downloadFile('tagesteller-gewicht-'+today()+'.csv','﻿'+rows.map(r=>r.join(';')).join('\r\n'),'text/csv'); };
  $('#dImp',body).onchange=e=>{
    const file=e.target.files[0]; if(!file) return; const rd=new FileReader();
    rd.onload=async()=>{ let o; try{ o=JSON.parse(rd.result); }catch(err){ o=null; }
      if(!o||!Array.isArray(o.entries)){ $('#impMsg',body).innerHTML='<div class="note">Diese Datei ist keine Tagesteller-Sicherung.</div>'; return; }
      const w=document.createElement('div'); w.className='dlg-wrap';
      w.innerHTML='<div class="dlg"><div>Sicherung mit <b>'+o.entries.length+' Einträgen</b> gefunden. Wie soll sie eingespielt werden?</div><button class="btn" id="iMerge">Zu meinen Daten hinzufügen</button><button class="btn sec" id="iRepl">Meine Daten ersetzen</button><button class="btn sec" id="iNo">Abbrechen</button></div>';
      document.body.appendChild(w);
      const done=msg=>{ w.remove(); save(); render(); toast(msg); backSheet(); };
      $('#iNo',w).onclick=()=>w.remove();
      $('#iRepl',w).onclick=()=>{ const b=blank(); Object.assign(b,o); b.targets=Object.assign({},DGE_W65,o.targets||{}); S=b; done('Sicherung eingespielt'); };
      $('#iMerge',w).onclick=()=>{
        const merge=(a,b,key)=>{ const ids=new Set(a.map(x=>x[key])); (b||[]).forEach(x=>{ if(!ids.has(x[key])) a.push(x); }); };
        merge(S.entries,o.entries,'id'); merge(S.custom,o.custom,'id'); merge(S.recipes,o.recipes,'id'); merge(S.saved,o.saved,'code'); merge(S.weights,o.weights,'d'); if(!S.goalKg && o.goalKg) S.goalKg=o.goalKg;
        (o.fav||[]).forEach(k=>{ if(!S.fav.includes(k)) S.fav.push(k); }); done('Daten zusammengeführt'); };
    };
    rd.readAsText(file);
  };
  $('#dDel',body).onclick=async()=>{ if(await ask('Wirklich alle Einträge, eigenen Lebensmittel und Speisen löschen? Das lässt sich nicht rückgängig machen.','Alles löschen',true)){ S=blank(); S.welcomed=true; save(); closeSheet(); render(); toast('Alle Daten gelöscht'); } };
  return {title:'Datensicherung'};
}
function infoSheet(body){
  body.innerHTML = '<div class="stack" style="max-width:62ch">'+
    '<p><b>Tagesteller</b> ist ein persönliches Ernährungstagebuch. Es läuft komplett auf diesem Gerät, braucht kein Konto und schickt keine Daten weg. Nur die Online-Suche und die Barcode-Suche fragen bei Open Food Facts an.</p>'+
    '<h2>Woher kommen die Werte?</h2>'+
    '<p>Die eingebaute Datenbank enthält '+(window.BASE_FOODS.length+(window.BLS_FOODS||[]).length).toLocaleString('de-DE')+' Lebensmittel und Gerichte aus dem <b>Bundeslebensmittelschlüssel (BLS 4.0)</b>, der deutschen Nährstoffdatenbank des Max Rubner-Instituts. '+window.BASE_FOODS.length+' Alltags-Lebensmittel haben zusätzlich Portionsgrößen. Die Werte sind Durchschnittswerte je 100 g und schwanken je nach Sorte, Rezept und Zubereitung. Für verpackte Produkte sind die Herstellerangaben aus der Online-Suche oder von der Packung genauer.</p>'+

    '<div class="note">Die App ersetzt keine ärztliche oder ernährungsmedizinische Beratung. Bei Erkrankungen oder einer verordneten Diät gelten die Vorgaben von Arzt oder Ernährungsberatung.</div>'+
    '<p class="small muted">Nährwerte: Max Rubner-Institut (2025): Bundeslebensmittelschlüssel (BLS), Version 4.0, Deutsche Nährstoffdatenbank. Karlsruhe. DOI: 10.25826/Data20251217-134202-0<br>Produktdaten: Open Food Facts (openfoodfacts.org), Lizenz ODbL.</p></div>';
  return {title:'Über diese App'};
}

/* ---------- Beispieldaten ---------- */
function loadDemo(){
  const plan = [
    ['fr',['Vollkornbrot',50],['Butter',10],['Gouda',25],['Kaffee, schwarz',200],['Milch 1,5 %',20]],
    ['fr',['Haferflocken',40],['Joghurt natur 1,5 %',150],['Heidelbeeren',80],['Tee (Schwarz-/Kräutertee)',250]],
    ['mi',['Kartoffeln, gekocht',200],['Seelachs / Kabeljau, gegart',150],['Spinat, gegart',150]],
    ['mi',['Spaghetti Bolognese',400],['Gemischter Salat mit Dressing',150]],
    ['mi',['Linseneintopf',350],['Mischbrot / Graubrot',45]],
    ['mi',['Hähnchenbrust, gegart',150],['Reis, gekocht',150],['Brokkoli, gegart',150]],
    ['ab',['Mischbrot / Graubrot',90],['Kochschinken',40],['Tomate',100],['Gurke',100]],
    ['ab',['Rührei',130],['Vollkornbrot',50],['Paprika, rot',80]],
    ['sn',['Apfel',150]],['sn',['Banane',120]],['sn',['Obstkuchen / Apfelkuchen',120],['Kaffee, schwarz',200]],['sn',['Walnüsse',25],['Kiwi',75]]
  ];
  const byName = Object.fromEntries(baseFoods().map(f=>[f.name,f]));
  const t = today(); let seed = 7; const rnd = ()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
  for(let i=13;i>=0;i--){
    const d = addDays(t,-i); if(i===4 || i===9) continue;
    const pick = m=>{ const opts=plan.filter(p=>p[0]===m); return opts[Math.floor(rnd()*opts.length)]; };
    ['fr','mi','ab','sn'].forEach(m=>{ if(m==='sn'&&rnd()<.3) return; if(i===0 && m!=='fr') return; pick(m).slice(1).forEach(([nm,g])=>{ const f=byName[nm]; if(f) S.entries.push({id:uid(),d,m,key:f.key,name:f.name,g,n:Object.assign({},f.n),ex:true}); }); });
  }
  for(let i=84;i>=0;i--){ if(i!==0 && rnd()<.6) continue; const d=addDays(t,-i); if(S.weights.some(w=>w.d===d)) continue;
    S.weights.push({id:uid(),d,kg:Math.round((66.1+i*0.017+(rnd()-.5)*0.6)*10)/10,ex:true}); }
  S.welcomed = true; save(); render(); toast('Beispieldaten geladen');
}
